<script>
(()=>{
// =====================================================================
// データの出入口（Supabase版とデモ版で同じ関数をそろえる）
// =====================================================================
const CFG=window.SEIKAI_CONFIG||{};
const DEMO=!(CFG.supabaseUrl&&CFG.supabaseAnonKey);

// デモ用の題材（色）。本番ではデータベースの内容を表示します。
const SAMPLE=[
 ['赤',[]],['青',[]],['緑',[]],
 ['黄',['赤','緑']],['紫',['赤','青']],['シアン',['青','緑']],['白',['赤','青','緑']],
 ['朱色',['赤']],['紅色',['赤']],['ピンク',['赤']],['紺',['青']],['群青',['青']],['水色',['青','シアン']],
 ['深緑',['緑']],['黄緑',['緑','黄']],['抹茶色',['緑']],['オレンジ色',['赤','黄']],['ターコイズ',['シアン']],
 ['りんご',['赤']],['いちご',['赤']],['トマト',['赤']],['ポスト',['赤']],
 ['空',['水色']],['海',['青']],['ジーンズ',['紺']],['葉',['緑']],['きゅうり',['深緑']],['メロン',['黄緑']],
 ['レモン',['黄']],['バナナ',['黄']],['みかん',['オレンジ色']],['ぶどう',['紫']],['ナス',['紫']],['桜',['ピンク']],['雪',['白']],
 ['信号機',['赤','黄','緑']],['地球',['青','緑']]
];

function errText(e){
  const m=e?.message||String(e);
  if(/term_parents_pkey/.test(m))return 'すでに親子になっています。';
  if(/terms_label_uniq|duplicate key/.test(m))return '同じ名前の用語がすでにあります。';
  if(/row-level security/.test(m))return '権限がありません。ログインと18歳以上の確認が必要です。';
  if(/check constraint/.test(m))return '入力内容が条件を満たしていません（名前は1〜40文字）。';
  return m;
}

function remoteApi(){
  const sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  const ok=r=>{if(r.error)throw r.error;return r.data};
  async function fetchAll(make){
    const out=[];
    for(let from=0;;from+=1000){const d=ok(await make().range(from,from+999));out.push(...d);if(d.length<1000)break}
    return out;
  }
  return {
    demo:false,
    onAuth(cb){sb.auth.onAuthStateChange(()=>cb())},
    async load(){
      const [terms,edges]=await Promise.all([
        fetchAll(()=>sb.from('terms').select('id,label,is_hidden').is('deleted_at',null).order('id')),
        fetchAll(()=>sb.from('term_parents').select('child_id,parent_id').order('child_id').order('parent_id'))
      ]);
      return {terms,edges};
    },
    async me(){
      const {data:{session}}=await sb.auth.getSession();
      if(!session)return null;
      const p=ok(await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle());
      if(!p)return {id:session.user.id,name:'名前未設定',role:'user',adult:false,banned:false};
      return {id:p.id,name:p.display_name||'名前未設定',role:p.role,adult:!!p.adult_confirmed_at,banned:p.is_banned};
    },
    async setName(name){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('ログインが必要です');
      ok(await sb.from('profiles').update({display_name:name}).eq('id',session.user.id))},
    async login(provider){ok(await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+location.pathname}}))},
    async logout(){await sb.auth.signOut()},
    async confirmAdult(){ok(await sb.rpc('confirm_adult'))},
    async addTerm(label,parentId){
      const t=ok(await sb.from('terms').insert({label}).select('id').single());
      if(parentId!=null)ok(await sb.from('term_parents').insert({child_id:t.id,parent_id:+parentId}));
      return String(t.id);
    },
    async rename(id,label){ok(await sb.from('terms').update({label}).eq('id',+id))},
    async remove(id){ok(await sb.rpc('soft_delete_term',{p_term_id:+id}))},
    async link(c,p){ok(await sb.from('term_parents').insert({child_id:+c,parent_id:+p}))},
    async unlink(c,p){ok(await sb.from('term_parents').delete().eq('child_id',+c).eq('parent_id',+p))},
    async setHidden(id,h){ok(await sb.from('terms').update({is_hidden:h}).eq('id',+id))},
    async history(id){
      let q=sb.from('revisions').select('*').order('id',{ascending:false}).limit(40);
      if(id!=null)q=q.or(`term_id.eq.${+id},parent_id.eq.${+id}`);
      const revs=ok(await q);
      const ids=[...new Set(revs.map(r=>r.actor).filter(Boolean))];
      const names=new Map();
      if(ids.length)ok(await sb.from('profiles').select('id,display_name').in('id',ids)).forEach(p=>names.set(p.id,p.display_name));
      return revs.map(r=>({...r,actorName:names.get(r.actor)}));
    },
    async revert(revId){ok(await sb.rpc('revert_revision',{p_revision_id:revId}))},
    async report(id,reason){ok(await sb.from('reports').insert({term_id:+id,reason}))},
    async reports(){return ok(await sb.from('reports').select('id,term_id,reason,created_at').eq('status','open').order('id',{ascending:false}).limit(30))},
    async resolveReport(id,status){ok(await sb.from('reports').update({status}).eq('id',id))}
  };
}

function demoApi(){
  let seq=1,rseq=1,pseq=1;
  const terms=[],edges=[],revs=[],reps=[];
  const user={id:'demo',name:'デモ利用者',role:'admin',adult:true,banned:false};
  const now=()=>new Date().toISOString();
  const alive=()=>terms.filter(t=>!t.deleted_at);
  const find=id=>terms.find(t=>t.id===+id);
  const log=(table_name,op,term_id,parent_id,old_data,new_data,source)=>revs.push({id:rseq++,table_name,op,term_id,parent_id,old_data,new_data,actor:user.id,actorName:user.name,source:source||'user',created_at:now(),reverted_at:null});
  const dup=(label,except)=>alive().some(t=>t.id!==except&&t.label.trim().toLowerCase()===label.trim().toLowerCase());
  const isAncOrSelf=(a,b)=>{const st=[b],seen=new Set();while(st.length){const x=st.pop();if(x===a)return true;if(seen.has(x))continue;seen.add(x);edges.filter(e=>e.child_id===x).forEach(e=>st.push(e.parent_id))}return false};
  const ids={};
  SAMPLE.forEach(([l])=>{const t={id:seq++,label:l,description:null,is_hidden:false,deleted_at:null};terms.push(t);ids[l]=t.id});
  SAMPLE.forEach(([l,ps])=>ps.forEach(p=>edges.push({child_id:ids[l],parent_id:ids[p]})));
  const fail=m=>{throw new Error(m)};
  let src;
  const api={
    demo:true,
    onAuth(){},
    async load(){const live=new Set(alive().map(t=>t.id));
      return {terms:alive().map(t=>({...t})),edges:edges.filter(e=>live.has(e.child_id)&&live.has(e.parent_id)).map(e=>({...e}))}},
    async me(){return user},
    async login(){fail('デモモードではログインできません。Supabaseの設定を入れてください。')},
    async logout(){fail('デモモードではログアウトできません。')},
    async confirmAdult(){},
    async setName(name){user.name=name},
    async addTerm(label,parentId){
      label=label.trim();if(!label||label.length>40)fail('用語名は40文字までです');
      if(dup(label))fail('同じ名前の用語がすでにあります。');
      const t={id:seq++,label,description:null,is_hidden:false,deleted_at:null};terms.push(t);log('terms','INSERT',t.id,null,null,{...t},src);
      if(parentId!=null)await api.link(t.id,parentId);
      return String(t.id);
    },
    async rename(id,label){const t=find(id);label=label.trim();if(!label||label.length>40)fail('用語名は40文字までです');
      if(dup(label,t.id))fail('同じ名前の用語がすでにあります。');const o={...t};t.label=label;log('terms','UPDATE',t.id,null,o,{...t},src)},
    async remove(id){const t=find(id);const o={...t};t.deleted_at=now();log('terms','UPDATE',t.id,null,o,{...t},src)},
    async link(c,p){c=+c;p=+p;if(c===p||isAncOrSelf(c,p))fail('循環する親子関係は作れません');
      if(edges.some(e=>e.child_id===c&&e.parent_id===p))fail('すでに親子になっています。');
      const e={child_id:c,parent_id:p};edges.push(e);log('term_parents','INSERT',c,p,null,{...e},src)},
    async unlink(c,p){c=+c;p=+p;const i=edges.findIndex(e=>e.child_id===c&&e.parent_id===p);if(i<0)return;
      const [e]=edges.splice(i,1);log('term_parents','DELETE',c,p,{...e},null,src)},
    async setHidden(id,h){const t=find(id);const o={...t};t.is_hidden=h;log('terms','UPDATE',t.id,null,o,{...t},src)},
    async history(id){return revs.filter(r=>id==null||r.term_id===+id||r.parent_id===+id).slice().reverse().slice(0,40).map(r=>({...r}))},
    async revert(revId){
      const r=revs.find(x=>x.id===revId);if(!r)fail('履歴が見つかりません');if(r.reverted_at)fail('この履歴は差し戻し済みです');
      src='revert';
      try{
        if(r.table_name==='terms'){
          const t=find(r.term_id);
          if(r.op==='INSERT'){const o={...t};t.deleted_at=now();log('terms','UPDATE',t.id,null,o,{...t},src)}
          else if(r.op==='UPDATE'){if(r.old_data.deleted_at==null&&dup(r.old_data.label,t.id))fail('同じ名前の用語がすでにあります。');
            const o={...t};Object.assign(t,{label:r.old_data.label,is_hidden:r.old_data.is_hidden,deleted_at:r.old_data.deleted_at});log('terms','UPDATE',t.id,null,o,{...t},src)}
        }else{
          if(r.op==='INSERT')await api.unlink(r.term_id,r.parent_id);
          else if(!edges.some(e=>e.child_id===r.term_id&&e.parent_id===r.parent_id))await api.link(r.term_id,r.parent_id);
        }
        r.reverted_at=now();
      }finally{src=undefined}
    },
    async report(id,reason){reps.push({id:pseq++,term_id:+id,reason,created_at:now(),status:'open'})},
    async reports(){return reps.filter(r=>r.status==='open').slice().reverse()},
    async resolveReport(id,status){const r=reps.find(x=>x.id===id);if(r)r.status=status}
  };
  return api;
}

const api=DEMO?demoApi():remoteApi();

// =====================================================================
// 状態
// =====================================================================
let nodes=new Map(), selected=null, me=null, loaded=false;
const canEdit=()=>!!(me&&me.adult&&!me.banned);
const isAdmin=()=>me?.role==='admin';
const POSKEY=DEMO?'seikai-demo-pos':'seikai-pos';
function loadPos(){try{return JSON.parse(localStorage.getItem(POSKEY)||'{}')}catch(e){return{}}}
function savePos(){try{const o={};nodes.forEach(n=>o[n.id]=[Math.round(n.x),Math.round(n.y)]);localStorage.setItem(POSKEY,JSON.stringify(o))}catch(e){}}

function setData({terms,edges}){
  const old=nodes,pos=loadPos();let fresh=0;
  nodes=new Map();
  for(const t of terms){const id=String(t.id),o=old.get(id),p=pos[id];
    nodes.set(id,{id,label:t.label,hidden:!!t.is_hidden,parents:[],x:o?.x??p?.[0],y:o?.y??p?.[1],vx:0,vy:0});
    if(!o&&!p)fresh++}
  for(const e of edges){const c=nodes.get(String(e.child_id)),pid=String(e.parent_id);if(c&&nodes.has(pid)&&!c.parents.includes(pid))c.parents.push(pid)}
  const roots=[...nodes.values()].filter(n=>!n.parents.length);
  roots.forEach((r,i)=>{if(r.x==null){const a=i/Math.max(1,roots.length)*Math.PI*2;r.x=Math.cos(a)*520;r.y=Math.sin(a)*380}});

function rebuild(){
  list=order();depth.clear();anc.clear();rootsOf.clear();kids.clear();
  list.forEach(n=>kids.set(n.id,[]));
  for(const n of list){
    const a=new Set();let d=0,rs=[];
    n.parents.forEach(p=>{if(!anc.has(p))return;a.add(p);anc.get(p).forEach(x=>a.add(x));d=Math.max(d,depth.get(p)+1);rootsOf.get(p).forEach(r=>rs.includes(r)||rs.push(r));kids.get(p).push(n.id)});
    if(!rs.length)rs=[n.id];

  rootList=list.filter(n=>depth.get(n.id)===0).map(n=>n.id);

  const sets=list.map(n=>new Set([...anc.get(n.id),n.id]));
  sim=list.map((_,i)=>list.map((_,j)=>{if(i>=j)return 0;let c=0;sets[i].forEach(x=>sets[j].has(x)&&c++);return c/(sets[i].size+sets[j].size-c)}));

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HUES=[340,200,140,265,38,175,8,95];
const DEMO_HUE={'赤':0,'青':218,'緑':128};
const hueOf=id=>{const n=nodes.get(id);if(DEMO&&n&&DEMO_HUE[n.label]!=null)return DEMO_HUE[n.label];return HUES[Math.max(0,rootList.indexOf(id))%HUES.length]};

// ---- force layout ----
let alpha=1,dirty=true;
const LINK=[0,300,150,95,70,60],W=[7,3,1.4,1,1,1];
function step(){
  if(alpha<0.004)return false;
  const n=list.length;
  for(let i=0;i<n;i++){const a=list[i],da=Math.min(depth.get(a.id),5);
    for(let j=i+1;j<n;j++){const b=list[j],db=Math.min(depth.get(b.id),5);
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1}

      const s=sim[i][j];if(s>0)f+=(d-(50+420*(1-s)))*0.004*s;
      const fx=f*dx/d,fy=f*dy/d;a.vx+=fx/W[da];a.vy+=fy/W[da];b.vx-=fx/W[db];b.vy-=fy/W[db]}}
  for(const c of list){const L=LINK[Math.min(depth.get(c.id),5)];
    for(const pid of c.parents){const p=nodes.get(pid);const dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy)||1;
      const f=(d-L)*0.06/Math.sqrt(c.parents.length);c.vx+=f*dx/d;c.vy+=f*dy/d;p.vx-=f*dx/d*.25;p.vy-=f*dy/d*.25}}

    if(depth.get(v.id)>0){let cx=0,cy=0;rs.forEach(r=>{const q=nodes.get(r);cx+=q.x;cy+=q.y});cx/=rs.length;cy/=rs.length;v.vx+=(cx-v.x)*0.012;v.vy+=(cy-v.y)*0.012}
    v.vx-=v.x*0.0015;v.vy-=v.y*0.0015;

  for(const[r,a]of acc){if(!a[2])continue;const q=nodes.get(r);if(q===drag?.node)continue;q.x+=(a[0]/a[2]-q.x)*0.04*alpha;q.y+=(a[1]/a[2]-q.y)*0.04*alpha}

}

let fly=null;
function loop(){const moving=loaded&&step();if(fly){const t=Math.min(1,(performance.now()-fly.t0)/500),e=1-Math.pow(1-t,3);

  if(me.banned)return `<div class="note">このアカウントは編集が停止されています。</div>`;
  return `<div class="note">編集するには、18歳以上であることの確認と<a href="./terms.html" style="color:var(--accent)">利用規約</a>への同意が必要です（取り消せません）。<div class="actions"><button class="primary" id="confirmAdult">18歳以上であり、利用規約に同意する</button></div></div>`;
}

function describe(r){
  const lab=(id,data)=>data?.label??nodes.get(String(id))?.label??`#${id}`;
  if(r.table_name==='terms'){
    const o=r.old_data,n=r.new_data,name=esc(lab(r.term_id,n||o));
    if(r.op==='INSERT')return `「${name}」を追加`;
    if(r.op==='DELETE')return `「${name}」を完全削除`;
    if(o.deleted_at==null&&n.deleted_at!=null)return `「${name}」を削除`;
    if(o.deleted_at!=null&&n.deleted_at==null)return `「${name}」を復元`;
    if(o.is_hidden!==n.is_hidden)return `「${name}」を${n.is_hidden?'非表示':'再表示'}`;
    if(o.label!==n.label)return `「${esc(o.label)}」→「${esc(n.label)}」に改名`;
    return `「${name}」を更新`;
  }
  const c=esc(lab(r.term_id)),p=esc(lab(r.parent_id));
  return r.op==='INSERT'?`「${c}」の親に「${p}」を追加`:`「${c}」を「${p}」から外す`;
}
function who(r){return r.source==='system'?'まとめ処理':r.source==='revert'?`差し戻し（${esc(r.actorName||'管理者')}）`:esc(r.actorName||'不明')}
const fmt=s=>{const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
async function fillHistory(id){
  const tok=++histToken,el=document.getElementById('hist');if(!el)return;
  try{
    const revs=await api.history(id);if(tok!==histToken)return;
    el.innerHTML=revs.length?`<ul>${revs.map(r=>`<li><span class="what ${r.reverted_at?'done':''}">${describe(r)}</span><span class="meta">${fmt(r.created_at)} · ${who(r)}</span>${isAdmin()&&!r.reverted_at?`<button class="rv" data-revert="${r.id}">差し戻す</button>`:''}</li>`).join('')}</ul>`:'<span class="empty">まだ履歴がありません</span>';
  }catch(e){if(tok===histToken)el.innerHTML=`<span class="empty">履歴を読み込めませんでした：${esc(errText(e))}</span>`}
}
async function fillReports(){
  const el=document.getElementById('reps');if(!el)return;
  try{const rs=await api.reports();
    el.innerHTML=rs.length?`<ul>${rs.map(r=>`<li><span class="what">${nodes.has(String(r.term_id))?`<button class="link" data-go="${r.term_id}">${esc(nodes.get(String(r.term_id)).label)}</button>`:`#${r.term_id}`}：${esc(r.reason)}</span><span class="meta">${fmt(r.created_at)}</span><span class="rv" style="display:flex;gap:4px"><button data-resolve="${r.id}">対応済み</button><button data-dismiss="${r.id}">却下</button></span></li>`).join('')}</ul>`:'<span class="empty">未対応の通報はありません</span>';
  }catch(e){el.innerHTML=`<span class="empty">${esc(errText(e))}</span>`}
}

function renderPanel(){
  if(!selected||!nodes.has(selected)){
    panel.innerHTML=`<div><div class="eyebrow">凡例 · 分野</div><h1>全体図</h1></div>
    ${DEMO?`<div class="note">デモモードです。データはこのページの中だけにあり、再読み込みで元に戻ります。公開するには index.html の先頭に Supabase の URL と anon key を入れてください。</div>`:''}
    <p>性的嗜好どうしのつながりと広がりを集める資料地図です。分野が陸地、用語が地点です。複数の親を持つ用語は親どうしの間に置かれ、共通の祖先が多い用語ほど近くに集まります。ズームすると下の階層の地名が現れます。</p>
    <div class="legend">${rootList.map(id=>`<button data-go="${esc(id)}"><i style="background:hsla(${hueOf(id)},38%,${T['--land-l']}%,.9)"></i>${esc(nodes.get(id).label)}<span class="empty">· ${list.filter(n=>rootsOf.get(n.id).includes(id)).length-1}語</span></button>`).join('')||'<span class="empty">まだ用語がありません</span>'}</div>
    ${editGate()}
    ${me?`<div><h2>あなたの表示名</h2><form class="row" id="setName"><input id="nameInput" maxlength="50" value="${esc(me.name)}" required aria-label="表示名"><button>変更</button></form><p class="hint" style="margin-top:6px">編集履歴に公開される名前です。本名は使わないことをおすすめします。</p></div>`:''}
    ${canEdit()?`<div><h2>新しい分野を追加</h2><form class="row" id="addRoot"><input id="rootName" maxlength="40" placeholder="分野の名前" required><button class="primary">追加</button></form></div>`:''}
    ${isAdmin()?`<div class="hist"><h2>未対応の通報</h2><div id="reps"><span class="empty">読み込み中…</span></div></div>`:''}
    <div class="hist"><h2>最近の変更</h2><div id="hist"><span class="empty">読み込み中…</span></div></div>
    <p class="hint">地点をタップで選択、ドラッグで移動。空白のドラッグで地図を動かし、ホイールかピンチで拡大します。地点の配置はこのブラウザに保存されます。</p>
    <p class="hint"><a href="./terms.html" style="color:var(--accent)">利用規約</a>　<a href="./privacy.html" style="color:var(--accent)">プライバシーポリシー</a></p>`;
    fillHistory(null);if(isAdmin())fillReports();
    return;
  }
  const n=nodes.get(selected),d=depth.get(selected),ch=kids.get(selected),E=canEdit();
  const banned=new Set([selected,...n.parents]);list.forEach(m=>{if(anc.get(m.id).has(selected))banned.add(m.id)});
  const opts=list.filter(m=>!banned.has(m.id)).sort((a,b)=>depth.get(a.id)-depth.get(b.id));
  panel.innerHTML=`<div><div class="eyebrow">第${d+1}階層 · ${rootsOf.get(selected).map(r=>esc(nodes.get(r).label)).join(' / ')}</div><h1>${esc(n.label)}</h1>${n.hidden?'<span class="hidden-mark">非表示中（管理者のみ見えています）</span>':''}</div>
  ${editGate()}
  ${E?`<div><h2>名前</h2><form class="row" id="rename"><input id="newLabel" maxlength="40" value="${esc(n.label)}" required aria-label="用語の名前"><button>変更</button></form></div>`:''}
  <div><h2>親要素 ${n.parents.length}</h2><div class="chips">${n.parents.map(p=>chip(p,E)).join('')||'<span class="empty">なし（分野の最上位）</span>'}</div></div>
  ${E?`<div><h2>親を追加</h2><div class="row"><select id="newParent" aria-label="親にする用語"><option value="">用語を選ぶ</option>${opts.map(m=>`<option value="${esc(m.id)}">${'　'.repeat(depth.get(m.id))}${esc(m.label)}</option>`).join('')}</select><button id="addParent">追加</button></div></div>`:''}
  <div><h2>子要素 ${ch.length}</h2><div class="chips">${ch.map(c=>chip(c,false)).join('')||'<span class="empty">なし</span>'}</div></div>
  ${E?`<div><h2>子要素を追加</h2><form class="row" id="addChild"><input id="childName" maxlength="40" placeholder="新しい用語" required><button class="primary">追加</button></form><p class="hint" style="margin-top:6px">用語名だけを登録します（40文字まで）。URL・連絡先・禁止事項は登録できません。</p></div>`:''}
  <div class="actions"><button id="back">全体図へ</button>${E?`<button id="del" class="danger">${confirmDel?'本当に削除する':'この用語を削除'}</button>`:''}${me?'<button id="report">通報</button>':''}${isAdmin()?`<button id="hide">${n.hidden?'再表示する':'非表示にする'}</button>`:''}</div>
  <div class="hist"><h2>この用語の履歴</h2><div id="hist"><span class="empty">読み込み中…</span></div></div>`;
  fillHistory(selected);
}

panel.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||(t.form&&t.type==='submit'))return;
  if(t.dataset.go){goTo(String(t.dataset.go));return}
  if(t.dataset.login){api.login(t.dataset.login).catch(err=>toast(errText(err),true));return}
  if(t.id==='confirmAdult'){api.confirmAdult().then(refreshMe).catch(err=>toast(errText(err),true));return}
  if(t.dataset.revert){if(!confirm('この変更を差し戻しますか？'))return;act(()=>api.revert(+t.dataset.revert),'差し戻しました');return}
  if(t.dataset.resolve){api.resolveReport(+t.dataset.resolve,'resolved').then(fillReports);return}
  if(t.dataset.dismiss){api.resolveReport(+t.dataset.dismiss,'dismissed').then(fillReports);return}
  if(t.dataset.unlink){act(()=>api.unlink(selected,t.dataset.unlink),'親から外しました');return}
  if(t.id==='addParent'){const v=document.getElementById('newParent').value;if(!v)return;act(()=>api.link(selected,v),'親を追加しました');return}
  if(t.id==='back'){select(null);fit();return}
  if(t.id==='del'){if(!confirmDel){confirmDel=true;renderPanel();return}const id=selected;confirmDel=false;selected=null;act(()=>api.remove(id),'削除しました');return}
  if(t.id==='hide'){const n=nodes.get(selected);act(()=>api.setHidden(selected,!n.hidden),n.hidden?'再表示しました':'非表示にしました');return}
  if(t.id==='report'){const reason=prompt('通報の理由を入力してください（1000文字まで）');if(!reason||!reason.trim())return;
    api.report(selected,reason.trim().slice(0,1000)).then(()=>toast('通報しました。ありがとうございます。')).catch(err=>toast(errText(err),true));return}
});
panel.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='addChild'){const name=document.getElementById('childName').value.trim();if(!name)return;
    const pid=selected;let newId;act(async()=>{newId=await api.addTerm(name,pid)},'追加しました').then(()=>{if(newId&&nodes.has(newId)){const p=nodes.get(pid),c=nodes.get(newId);c.x=p.x+(Math.random()-.5)*60;c.y=p.y+(Math.random()-.5)*60;select(newId)}})}
  if(e.target.id==='addRoot'){const name=document.getElementById('rootName').value.trim();if(!name)return;
    let newId;act(async()=>{newId=await api.addTerm(name,null)},'分野を追加しました').then(()=>{if(newId&&nodes.has(newId)){const a=Math.random()*Math.PI*2,c=nodes.get(newId);c.x=Math.cos(a)*700;c.y=Math.sin(a)*500;goTo(newId)}})}
  if(e.target.id==='setName'){const v=document.getElementById('nameInput').value.trim();if(!v||v.length>50)return;
    api.setName(v).then(()=>{toast('表示名を変更しました');return refreshMe()}).catch(err=>toast(errText(err),true))}
  if(e.target.id==='rename'){const v=document.getElementById('newLabel').value.trim();if(!v||v===nodes.get(selected).label)return;act(()=>api.rename(selected,v),'名前を変更しました')}
});

document.getElementById('fit').onclick=fit;
document.getElementById('reload').onclick=()=>reload().then(()=>toast('最新の状態にしました'));
document.getElementById('search').addEventListener('change',e=>{const q=e.target.value.trim();if(!q)return;const n=list.find(m=>m.label===q)||list.find(m=>m.label.toLowerCase().includes(q.toLowerCase()));if(n){goTo(n.id);e.target.value=''}else toast('見つかりませんでした')});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))select(null)});

// ---- 年齢確認（閲覧） ----
const gate=document.getElementById('gate');
let ageOk=false;try{ageOk=localStorage.getItem('seikai-age-ok')==='1'}catch(e){}
gate.hidden=ageOk;
document.getElementById('gateYes').onclick=()=>{try{localStorage.setItem('seikai-age-ok','1')}catch(e){}gate.hidden=true};
document.getElementById('gateNo').onclick=()=>{document.getElementById('gateMsg').hidden=false};

// ---- 起動 ----
document.getElementById('demoBadge').hidden=!DEMO;
api.onAuth(refreshMe);
resize();renderAuth();renderPanel();requestAnimationFrame(loop);
(async()=>{
  await refreshMe();
  await reload();
  for(let i=0;i<350;i++)step();
  resize();fit();if(fly){cam={...fly.b};fly=null}dirty=true;
})();
})();
</script>
</body>
